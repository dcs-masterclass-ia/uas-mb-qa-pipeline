name: qa-uas-mb
# Poller Jira -> recette automatique. Dépôt public : aucune donnée sensible ici, tout vient des secrets et du dépôt privé « core ».
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-uas-mb
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer le dépôt privé (parcours, recette, config)
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CORE_REPO }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}   # clé de déploiement en LECTURE SEULE sur ce seul dépôt
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r core/requirements.txt
      - name: "Poller - simulation (ajouter --apply pour passer en réel)"
        env:
          JIRA_SITE: ${{ secrets.JIRA_SITE }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_TOKEN: ${{ secrets.JIRA_TOKEN }}
          QA_LINK_SECRET: ${{ secrets.QA_LINK_SECRET }}
          UAS_MB_TEAMS_WEBHOOK: ${{ secrets.UAS_MB_TEAMS_WEBHOOK }}
          DECISION_BASE_URL: ${{ vars.DECISION_BASE_URL }}
          QA_CONFIG: core/config/workflow.yml
          PYTHONPATH: .:core
        run: python -m pipeline.poller
